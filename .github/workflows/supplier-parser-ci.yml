name: Supplier parser regression (no secrets)

on:
  pull_request:
    branches: [main]
    paths:
      - "manufacturer_checker/**"
      - ".github/workflows/supplier-parser-ci.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r manufacturer_checker/requirements.txt
      - name: Run entire offline unittest suite
        working-directory: manufacturer_checker
        env:
          KEEPA_API_KEY: ""
          DRIVE_PARENT_FOLDER_ID: ""
        run: python -m unittest discover -s tests -v
      - name: Simulate safe crash-recovery dry run (synthetic only)
        working-directory: manufacturer_checker
        env:
          KEEPA_API_KEY: ""
          DRIVE_PARENT_FOLDER_ID: ""
        run: |
          python -m supplier_docs.job_dry_run --scenario after_scan
          python -m supplier_docs.job_dry_run --scenario partial_review
          python -m supplier_docs.job_dry_run --scenario cas_committed
          python -m supplier_docs.job_dry_run --scenario cas_conflict
