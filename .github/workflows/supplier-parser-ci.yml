name: Supplier parser regression (no secrets)

on:
  pull_request:
    branches: [main]
    paths:
      - "manufacturer_checker/**"
      - ".github/workflows/supplier-parser-ci.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r manufacturer_checker/requirements.txt
      - name: Verify exact SHA256 private-runner wheels in an isolated Linux Python 3.11 environment
        shell: bash
        env:
          KEEPA_API_KEY: ""
          DRIVE_PARENT_FOLDER_ID: ""
        run: |
          set -euo pipefail
          python -m venv /tmp/supplier-private-deps-check
          /tmp/supplier-private-deps-check/bin/python -m pip install \
            --require-hashes --only-binary=:all: \
            -r manufacturer_checker/supplier_docs/approved-requirements-hashed.txt
          /tmp/supplier-private-deps-check/bin/python -m pip check
          /tmp/supplier-private-deps-check/bin/python -c \
            'import cryptography, google.auth, googleapiclient.discovery; print("Private runner hash-locked dependency imports OK")'
      - name: Run entire offline unittest suite
        working-directory: manufacturer_checker
        env:
          KEEPA_API_KEY: ""
          DRIVE_PARENT_FOLDER_ID: ""
        run: python -m unittest discover -s tests -v
      - name: Simulate safe crash-recovery dry run (synthetic only)
        working-directory: manufacturer_checker
        env:
          KEEPA_API_KEY: ""
          DRIVE_PARENT_FOLDER_ID: ""
        run: |
          python -m supplier_docs.job_dry_run --scenario after_scan
          python -m supplier_docs.job_dry_run --scenario partial_review
          python -m supplier_docs.job_dry_run --scenario cas_committed
          python -m supplier_docs.job_dry_run --scenario cas_conflict

      - name: Test manual-only supplier Apps Script offline (no Google credentials)
        env:
          KEEPA_API_KEY: ""
          DRIVE_PARENT_FOLDER_ID: ""
        run: node --test manufacturer_checker/free_monitor/tests/monitor.test.cjs

  container-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR merge commit without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build synthetic-only container without publishing it
        run: |
          docker build \
            --file manufacturer_checker/Dockerfile.supplier-docs-dry-run \
            --tag supplier-docs-dry-run:ci \
            manufacturer_checker
      - name: Verify non-root and no-network read-only recovery simulation
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' supplier-docs-dry-run:ci)" = '10001:10001'
          for scenario in after_scan partial_review all_reviewed cas_committed cas_conflict unchanged; do
            output="$(docker run --rm --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 32 --memory 256m --cpus 1 \
              supplier-docs-dry-run:ci --scenario "$scenario")"
            echo "$output" | SCENARIO="$scenario" python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)
          assert d["scenario"] == os.environ["SCENARIO"]
          assert d["mode"] == "synthetic_offline_dry_run"
          assert d["summary"]["cloud_api_calls"] == 0
          assert not d["summary"]["baseline_advanced_by_this_check"]
          assert "fake_sheet_" not in json.dumps(d)
          assert "fake_folder_" not in json.dumps(d)
          '
          done
      - name: Reject live flags and disallowed modules inside container
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            supplier-docs-dry-run:ci --live >/dev/null 2>&1; then
            echo "Unsafe live flag was accepted" >&2
            exit 1
          fi
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python supplier-docs-dry-run:ci -c '
          import os
          from pathlib import Path
          assert os.geteuid() == 10001
          base = Path("/app/supplier_docs")
          for module in ("auth.py", "cloud_state.py", "change_processor.py",
                         "review_journal.py", "cli.py"):
              assert not (base / module).exists(), module
          assert not Path("/app/manufacturer_checker").exists()
          '

  windows-local-backup-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out development code without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python for synthetic-only Windows backup tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r manufacturer_checker/requirements.txt
      - name: Verify Windows local backup create-once and signed restore checks
        working-directory: manufacturer_checker
        env:
          KEEPA_API_KEY: ""
          DRIVE_PARENT_FOLDER_ID: ""
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_supplier_local_backup*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_supplier_owner_key_vault.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
